# 개발용: docker-compose의 MySQL 사용. 접속 정보는 루트 .env에서 읽는다.
# 실행 (backend/에서): ./gradlew bootRun --args='--spring.profiles.active=dev'
spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE}
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway(db/migration)가 만들고 JPA는 검증만 한다
  flyway:
    enabled: true
